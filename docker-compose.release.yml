# =============================================================================
# WikiHub - run prebuilt images (no source checkout, no build)
#
# The images are published by .github/workflows/release-images.yml on every
# push to master. On the server, this file and a .env are all that is needed:
#
#   cp .env.example .env          # then edit - see the notes below
#   docker compose -f docker-compose.release.yml pull
#   docker compose -f docker-compose.release.yml up -d
#
# Update later with the same `pull` + `up -d`.
#
# Unlike docker-compose.yml this file has no `build:` sections and does not
# bind-mount ./backend over the image's code; it is otherwise the same stack.
# Persistent data and the backup-directory ownership requirement are exactly
# as described at the top of docker-compose.yml.
#
# Set in .env for a server that is not your own machine:
#   NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL   how the *browser* reaches the
#       Document Server, e.g. http://203.0.113.10:8080. Read at container
#       start, so changing it needs `up -d`, not a rebuild.
#   WIKIHUB_CORS_ORIGINS   the address people open WikiHub at.
#   WIKIHUB_ENV=production, and real values for every secret and password.
#
# Choosing images (both optional, set in .env):
#   WIKIHUB_IMAGE_PREFIX   registry path shared by both images
#   WIKIHUB_IMAGE_TAG      `latest` follows master; `sha-<commit>` or a
#                          release such as `1.2.0` pins a version
# Private packages need `docker login ghcr.io` first (a token with
# read:packages), or make the packages public in GitHub.
# =============================================================================

name: wikihub

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wikihub}
      # Deterministic collation keeps index ordering stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wikihub} -d ${POSTGRES_DB:-wikihub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/redis:/data
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WIKIHUB_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/minio:/data
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the bucket the application expects, then exit.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${WIKIHUB_S3_BUCKET:-wikihub}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set none local/$$BUCKET &&
      echo 'bucket ready: '$$BUCKET
      "
    restart: "no"

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${WIKIHUB_ONLYOFFICE_JWT_SECRET:-wikihub-local-onlyoffice-dev-secret-replace-before-production}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PORT_HOST:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # Runs on every `up`, so a new image never meets an out-of-date schema.
  migrate:
    image: ${WIKIHUB_IMAGE_PREFIX:-ghcr.io/quanblue/wiki-hub}-backend:${WIKIHUB_IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${WIKIHUB_IMAGE_PREFIX:-ghcr.io/quanblue/wiki-hub}-backend:${WIKIHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      # See docker-compose.yml for why only these two live here rather than
      # in .env.
      WIKIHUB_S3_PUBLIC_ENDPOINT_URL: ${WIKIHUB_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${MINIO_PORT_HOST:-9000}}
      WIKIHUB_AUTOMATED_BACKUP_DIRECTORY: /backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT_HOST:-8000}:8000"
    volumes:
      - ${WIKIHUB_BACKUP_HOST_DIRECTORY:-${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/automated-backups}:/backups
    # Chromium (page export) needs more than Docker's default 64MB /dev/shm.
    shm_size: "512mb"

  worker:
    image: ${WIKIHUB_IMAGE_PREFIX:-ghcr.io/quanblue/wiki-hub}-backend:${WIKIHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file: [.env]
    environment:
      WIKIHUB_S3_PUBLIC_ENDPOINT_URL: ${WIKIHUB_S3_PUBLIC_ENDPOINT_URL:-http://localhost:${MINIO_PORT_HOST:-9000}}
      WIKIHUB_AUTOMATED_BACKUP_DIRECTORY: /backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${WIKIHUB_BACKUP_HOST_DIRECTORY:-${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/automated-backups}:/backups
    shm_size: "512mb"
    healthcheck:
      # arq heartbeats into Redis; `--check` exits non-zero when that beat goes
      # stale, so this detects a wedged worker, not merely a live process.
      test: ["CMD", "arq", "app.workers.settings.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ${WIKIHUB_IMAGE_PREFIX:-ghcr.io/quanblue/wiki-hub}-frontend:${WIKIHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # The API proxy destination itself is fixed inside the image as
      # http://backend:8000, so the service above must keep the name `backend`.
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL: ${NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL:-http://localhost:${ONLYOFFICE_PORT_HOST:-8080}}
    depends_on:
      backend:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:3000"
