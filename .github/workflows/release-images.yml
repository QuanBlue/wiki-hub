# =============================================================================
# Build and publish the WikiHub container images to GitHub Container Registry.
#
# Every push to master publishes:
#   ghcr.io/<owner>/<repo>-backend   (API + arq worker + migrations, one image)
#   ghcr.io/<owner>/<repo>-frontend  (Next.js standalone server)
# tagged `latest` and `sha-<short commit>`. Pushing a `vX.Y.Z` tag also
# publishes `X.Y.Z` and `X.Y`, for servers that should pin a release.
#
# A server then runs `docker-compose.release.yml` (pull, no build) instead of
# building from source - see the Deployment section of the README.
#
# Authentication is the workflow's own GITHUB_TOKEN; no secret needs adding.
# =============================================================================

name: Release images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same ref makes an in-flight build of it pointless.
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/docker/backend.Dockerfile
            build-args: ""
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            # NEXT_PUBLIC_* values are inlined into the JavaScript at build
            # time, so a prebuilt image would otherwise carry `localhost:8080`
            # to every server. This placeholder is swapped for the container's
            # real value at start-up by deploy/docker/frontend-entrypoint.sh.
            build-args: |
              NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL=__WIKIHUB_RUNTIME_NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL__

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name, which registry paths require.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          # backend.Dockerfile downloads the amd64 pandoc package.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          # Layer cache is what keeps the Chromium/pip layers from being
          # rebuilt on every push.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Attestation manifests show up as extra "unknown/unknown" entries
          # in the GHCR package page.
          provenance: false
