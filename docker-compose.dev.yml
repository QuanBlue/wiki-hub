# =============================================================================
# WikiHub - development overlay (hot reload)
#
#   ./scripts/run.sh --dev
#   # equivalent to:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Edit anything under backend/ or frontend/ and the running containers pick the
# change up without a rebuild:
#
#   backend   uvicorn --reload   (watchfiles, ships with uvicorn[standard])
#   worker    arq --watch
#   frontend  next dev --webpack
#
# Polling is deliberate. Docker Desktop does not reliably forward filesystem
# events from Windows bind mounts, particularly when a repository lives outside
# the Linux filesystem. It costs a small amount of idle CPU but makes edits on
# E:/, C:/ and WSL-mounted paths consistently trigger a reload.
#
# This overlay is NOT named docker-compose.override.yml on purpose: Compose
# auto-loads that filename, which would silently turn every plain
# `docker compose up` into a development run.
# =============================================================================

services:
  backend:
    # --reload-dir keeps the watcher on application code only, so a stray file
    # in the mounted tree does not restart the API in a loop.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      WIKIHUB_ENV: development
      WIKIHUB_DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"

  worker:
    command:
      - arq
      - app.workers.settings.WorkerSettings
      - --watch
      - /app/app
    environment:
      WIKIHUB_ENV: development
      WIKIHUB_DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"

  frontend:
    build:
      target: dev
    # /app/node_modules is an anonymous volume so it survives source bind
    # mounts. Reconcile it only when package-lock.json changed; running npm ci
    # on every dev start makes the frontend stay unhealthy for several minutes.
    command:
      - sh
      - -c
      - >-
        lock_hash=$$(sha256sum package-lock.json | awk '{print $$1}');
        stamp=/app/node_modules/.wikihub-package-lock;
        if [ ! -f "$$stamp" ] || [ "$$(cat "$$stamp")" != "$$lock_hash" ]; then
          npm ci && printf '%s' "$$lock_hash" > "$$stamp";
        fi;
        npm run dev:docker
    environment:
      NODE_ENV: development
      # Watchpack polling is reliable for Docker bind mounts on Windows.
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "500"
    volumes:
      # Source from the host...
      - ./frontend:/app
      # ...but keep the container's own node_modules and build cache. Anonymous
      # volumes shadow the bind mount, so host artifacts (built for a different
      # platform, or absent entirely) can never break the container.
      - /app/node_modules
      - /app/.next
