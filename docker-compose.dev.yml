# =============================================================================
# WikiHub - development overlay (hot reload)
#
#   ./scripts/run.sh --dev
#   # equivalent to:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Edit anything under backend/ or frontend/ and the running containers pick the
# change up without a rebuild:
#
#   backend   uvicorn --reload   (watchfiles, ships with uvicorn[standard])
#   worker    arq --watch
#   frontend  next dev --webpack
#
# Polling is deliberate. Docker Desktop does not reliably forward filesystem
# events from Windows bind mounts, particularly when a repository lives outside
# the Linux filesystem. It costs a small amount of idle CPU but makes edits on
# E:/, C:/ and WSL-mounted paths consistently trigger a reload.
#
# This overlay is NOT named docker-compose.override.yml on purpose: Compose
# auto-loads that filename, which would silently turn every plain
# `docker compose up` into a development run.
# =============================================================================

services:
  backend:
    # --reload-dir keeps the watcher on application code only, so a stray file
    # in the mounted tree does not restart the API in a loop.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      WIKIHUB_ENV: development
      WIKIHUB_DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"

  worker:
    command:
      - arq
      - app.workers.settings.WorkerSettings
      - --watch
      - /app/app
    environment:
      WIKIHUB_ENV: development
      WIKIHUB_DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"

  frontend:
    build:
      target: dev
    # /app/node_modules is an anonymous volume so it survives source bind
    # mounts. Reconcile it only when package-lock.json changed; running npm ci
    # on every dev start makes the frontend stay unhealthy for several minutes.
    #
    # The `rm -f .next/dev/lock` first is required, not tidiness. `next dev`
    # records its own PID there, and .next lives on the host bind mount (see
    # the volumes note below), so the file outlives the container. PIDs inside
    # a container are small and get reused, so the next start finds a live
    # process at the recorded PID, concludes another dev server owns the
    # directory, and exits - leaving the container restart-looping until the
    # healthcheck times out. Nothing can legitimately hold the lock at the
    # moment this container starts.
    #
    # .next is dropped whenever npm ci runs, and only then. The two live in
    # different places - node_modules in an anonymous volume, .next on the host
    # bind mount - so rebuilding the image discards the first and keeps the
    # second, leaving a build cache compiled against dependencies that are no
    # longer installed. Next does not detect that: it boots, serves 200s, and
    # the browser sits in a reload loop printing "missing required error
    # components, refreshing...". Nothing in .next is worth keeping once its
    # node_modules is gone, so clearing it here costs only the first compile.
    command:
      - sh
      - -c
      - >-
        rm -f /app/.next/dev/lock;
        lock_hash=$$(sha256sum package-lock.json | awk '{print $$1}');
        stamp=/app/node_modules/.wikihub-package-lock;
        if [ ! -f "$$stamp" ] || [ "$$(cat "$$stamp")" != "$$lock_hash" ] || [ ! -f /app/node_modules/@lamberl-lee/file-preview/package.json ]; then
          npm ci && printf '%s' "$$lock_hash" > "$$stamp" && rm -rf /app/.next;
        fi;
        npm run dev:docker
    # dev:docker passes `-H 0.0.0.0`, and it has to. Left to its default,
    # `next dev` here binds a v6-only wildcard socket: the container answers
    # its own `localhost` (and so its healthcheck) perfectly while docker-proxy,
    # which dials the container's IPv4 address, cannot connect at all. The
    # container then sits there reported healthy and unreachable from the host,
    # and the browser - reaching some requests over ::1 and losing others - ends
    # up in a reload loop printing "missing required error components".
    environment:
      NODE_ENV: development
      # Watchpack polling is reliable for Docker bind mounts on Windows.
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "500"
    # The image's healthcheck requests `/` without following redirects, so the
    # middleware's 307 to /login satisfies it. That answer needs no route to be
    # compiled, so the container reports healthy - and run.sh announces the
    # stack is up - while every real page still 404s. Follow the redirect so
    # "healthy" means a page actually rendered.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 20s
      start_period: 180s
      retries: 10
    volumes:
      # Source from the host...
      - ./frontend:/app
      # node_modules stays in an anonymous volume so the Linux-built packages
      # are never shadowed by Windows host artifacts or a missing directory.
      # NOTE: /app/.next is intentionally NOT an anonymous volume so that
      # `next dev` always compiles from the live bind-mount. Keeping a stale
      # .next volume caused 404s after code changes because the old route
      # manifest remained active even after the source was updated on the host.
      - /app/node_modules
