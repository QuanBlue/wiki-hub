# =============================================================================
# WikiHub - local development stack
#
#   cp .env.example .env
#   docker compose up -d
#
#   Frontend  http://localhost:3000
#   API docs  http://localhost:8000/docs
#   MinIO UI  http://localhost:9001
#
# Every credential comes from .env - nothing sensitive is committed here.
# =============================================================================

name: wikihub

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wikihub}
      # Deterministic collation keeps index ordering stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wikihub} -d ${POSTGRES_DB:-wikihub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the bucket the application expects, then exit.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${WIKIHUB_S3_BUCKET:-wikihub}
    volumes:
      - ./deploy/minio-cors.json:/tmp/minio-cors.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set none local/$$BUCKET &&
      mc cors set local/$$BUCKET /tmp/minio-cors.json &&
      echo 'bucket ready: '$$BUCKET
      "
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      WIKIHUB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wikihub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wikihub}
      WIKIHUB_REDIS_URL: redis://redis:6379/0
      WIKIHUB_S3_ENDPOINT_URL: http://minio:9000
      WIKIHUB_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT_HOST:-9000}
      # The quick-start script may choose a different frontend port when 3000
      # is occupied. Pass its matching CORS origin into the container instead
      # of leaving the backend bound to the value stored in .env.
      WIKIHUB_CORS_ORIGINS: ${WIKIHUB_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT_HOST:-8000}:8000"
    volumes:
      # Live reload during development; remove for a production-like run.
      - ./backend:/app

  worker:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file: [.env]
    environment:
      WIKIHUB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wikihub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wikihub}
      WIKIHUB_REDIS_URL: redis://redis:6379/0
      WIKIHUB_S3_ENDPOINT_URL: http://minio:9000
      WIKIHUB_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT_HOST:-9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      # arq heartbeats into Redis; `--check` exits non-zero when that beat goes
      # stale, so this detects a wedged worker, not merely a live process.
      test: ["CMD", "arq", "app.workers.settings.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-WikiHub}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API over the compose network.
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-WikiHub}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
