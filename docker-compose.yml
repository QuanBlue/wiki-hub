# =============================================================================
# WikiHub - local development stack
#
#   cp .env.example .env
#   docker compose up -d
#
#   Frontend  http://localhost:3000
#   API docs  http://localhost:8000/docs
#   MinIO UI  http://localhost:9001
#
# Every credential comes from .env - nothing sensitive is committed here.
#
# All persistent data (Postgres, Redis, MinIO, automated backups) is bind-
# mounted from a single host directory rather than scattered across
# Docker-managed named volumes, so it lives somewhere findable and
# backup-able on the host - one knob, WIKIHUB_DATA_HOST_DIRECTORY in .env,
# picks where; a real deployment points it at whatever partition the server
# actually reserves, and each store gets its own subdirectory underneath,
# created automatically on first `docker compose up`. Left unset, it
# defaults to a project-relative ./data folder (see .env.example).
#
# Automated backups alone can be pointed somewhere else entirely (a second
# disk, a mounted network share) with WIKIHUB_BACKUP_HOST_DIRECTORY - left
# unset, they stay under WIKIHUB_DATA_HOST_DIRECTORY like every other store.
#
# The backend/worker containers run as an unprivileged user (uid 10001,
# "wikihub" - never root), unlike postgres/redis/minio which each manage
# their own data directory's ownership themselves. Whatever the automated
# backups directory resolves to (WIKIHUB_BACKUP_HOST_DIRECTORY, or
# .../automated-backups under WIKIHUB_DATA_HOST_DIRECTORY) must already be
# writable by uid 10001 before a scheduled backup can succeed - Docker
# auto-creates a missing bind-mount directory owned by root, which is not
# writable by 10001 either. A scheduled run finding it unwritable fails
# with a permission error (surfaced as the schedule's own "failed" status,
# not a crash), so fix it with e.g.:
#   docker run --rm -v <the resolved host path>:/target busybox chown -R 10001:10001 /target
#
# Every WIKIHUB_*/service env var lives in .env(.example) exactly once and
# reaches containers through `env_file:` below. A service's own `environment:`
# block only ever adds what genuinely cannot be a static .env line (a value
# assembled from another compose variable, or a path fixed by a volume mount)
# - never a plain copy of something .env already sets. `environment:` wins
# over `env_file:`, so a stray copy would silently swallow the user's own
# .env edit instead of just being redundant.
# =============================================================================

name: wikihub

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wikihub}
      # Deterministic collation keeps index ordering stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wikihub} -d ${POSTGRES_DB:-wikihub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/redis:/data
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO no longer publishes runnable community images: minio/minio and
    # minio/mc are gone from Docker Hub and quay.io/minio/* now refuses
    # anonymous pulls ("unauthorized"). Bitnami's frozen legacy copy is the
    # last one that still pulls anonymously; it receives no further updates.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    # Bitnami's image runs as uid 1001 and keeps its data in /bitnami/minio/data
    # by default. Data written by the earlier quay.io image is owned by root and
    # lives in /data, so run as root against that same directory - otherwise the
    # existing buckets are unreadable after the swap. The Bitnami entrypoint
    # starts the server itself (console on :9001), so there is no `command`.
    user: "0:0"
    environment:
      MINIO_DATA_DIR: /data
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # MinIO implements no per-bucket CORS API (PutBucketCors returns "not
      # implemented"), so browser access to presigned attachment URLs is gated
      # here, server-wide, by the same origin list the backend accepts.
      # Unset, MinIO would answer every preflight with Allow-Origin: *.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WIKIHUB_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/minio:/data
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the bucket the application expects, then exit.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${WIKIHUB_S3_BUCKET:-wikihub}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set none local/$$BUCKET &&
      echo 'bucket ready: '$$BUCKET
      "
    restart: "no"

  onlyoffice:
    # Full-fidelity DOCX/XLSX editing engine. The browser reaches it via the
    # published port, while it reaches WikiHub through the compose network.
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${WIKIHUB_ONLYOFFICE_JWT_SECRET:-wikihub-local-onlyoffice-dev-secret-replace-before-production}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # WikiHub is reached through the private compose network. This is kept
      # limited to the document-server container; public deployments should
      # route the value below through their internal service hostname.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PORT_HOST:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # Keep schema changes coupled to every normal `docker compose up`, not only
  # the helper script. Without this a newly deployed UI can call an endpoint
  # whose table/columns do not exist yet and remain stuck loading forever.
  migrate:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    # POSTGRES_USER/PASSWORD/DB come straight from .env via env_file below;
    # app/core/config.py assembles the DSN from them itself (host/port
    # default to the "postgres" service on its standard port).
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Everything WikiHub-specific that has one fixed, correct value lives
      # in .env(.example) only and reaches the container via env_file above -
      # duplicating it here as a literal would silently win over whatever the
      # user sets in .env (`environment:` takes precedence over `env_file:`),
      # so a real override would appear to do nothing. Only what genuinely
      # cannot live as a static line in .env stays here:
      #  - values assembled from another compose variable (the host port
      #    picked at `docker compose up` time, not known when .env was written)
      #  - a container-internal path fixed by the volume mount below, not by
      #    the host
      WIKIHUB_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT_HOST:-9000}
      # Fixed to match the mount target below - this is where /backups
      # resolves *inside* the container, not a host path, so it has no
      # .env equivalent.
      WIKIHUB_AUTOMATED_BACKUP_DIRECTORY: /backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT_HOST:-8000}:8000"
    volumes:
      # Live reload during development; remove for a production-like run.
      - ./backend:/app
      - ${WIKIHUB_BACKUP_HOST_DIRECTORY:-${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/automated-backups}:/backups
    # Chromium (page export) needs more than Docker's default 64MB /dev/shm;
    # --disable-dev-shm-usage in app/services/browser.py covers the same risk
    # from the other side.
    shm_size: "512mb"

  worker:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file: [.env]
    environment:
      # See the backend service above: only a compose-derived value and a
      # container-internal path belong here, everything else lives in
      # .env(.example) alone.
      WIKIHUB_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT_HOST:-9000}
      WIKIHUB_AUTOMATED_BACKUP_DIRECTORY: /backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ${WIKIHUB_BACKUP_HOST_DIRECTORY:-${WIKIHUB_DATA_HOST_DIRECTORY:-./data}/automated-backups}:/backups
    shm_size: "512mb"
    healthcheck:
      # arq heartbeats into Redis; `--check` exits non-zero when that beat goes
      # stale, so this detects a wedged worker, not merely a live process.
      test: ["CMD", "arq", "app.workers.settings.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        API_INTERNAL_BASE_URL: http://backend:8000
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-WikiHub}
        NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL: ${NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL:-http://localhost:${ONLYOFFICE_PORT_HOST:-8080}}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API over the compose network.
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-WikiHub}
      NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL: ${NEXT_PUBLIC_ONLYOFFICE_DOCUMENT_SERVER_URL:-http://localhost:${ONLYOFFICE_PORT_HOST:-8080}}
    depends_on:
      backend:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:3000"
