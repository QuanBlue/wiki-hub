[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikihub"
version = "0.1.0"
description = "WikiHub - self-hosted internal documentation platform"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
  # --- web ---
  "fastapi>=0.141,<1.0",
  # Pinned explicitly (not just via FastAPI) to keep the image clear of
  # CVE-2025-62727, CVE-2026-48818 and CVE-2026-54283.
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.32,<0.40",
  "python-multipart>=0.0.18",
  # --- validation / settings ---
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2",
  # --- database ---
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.14,<2",
  "greenlet>=3.1",
  # --- cache / queue ---
  "redis>=5.2,<7",
  "arq>=0.26,<0.27",
  # --- object storage ---
  "boto3>=1.35",
  # --- auth ---
  "argon2-cffi>=23.1",
  "pyjwt>=2.10,<3",
  # --- content parsing / conversion ---
  "lxml>=5.3",
  "beautifulsoup4>=4.12",
  "markdown-it-py>=3.0",
  "python-slugify>=8.0",
  "filetype>=1.2",
  # --- observability ---
  "structlog>=24.4",
  "orjson>=3.10",
  "weasyprint>=66,<67",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-beautifulsoup4",
  "boto3-stubs[s3]",
  "faker>=33.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "SIM",  # simplify
  "TID",  # tidy imports
  "RUF",
  "ASYNC",
  "S",    # bandit
  "BLE",  # no blind `except Exception` without an explicit justification
]
ignore = [
  "B008",  # FastAPI Depends() in defaults is the documented idiom
  "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = "^(app/alembic/versions/|tests/)"

[[tool.mypy.overrides]]
module = ["scripts.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "--strict-markers"
markers = [
  "integration: requires PostgreSQL / Redis / MinIO to be running",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]
