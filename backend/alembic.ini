# Alembic configuration.
#
# The database URL is intentionally NOT set here - app/alembic/env.py reads it
# from WIKIHUB_DATABASE_URL so credentials never live in a committed file.

[alembic]
script_location = app/alembic
prepend_sys_path = .
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so they sort in the
# order they were authored regardless of branch merge order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# No post-write hook: resolving a console_scripts entrypoint depends on which
# interpreter alembic happens to run under, and it fails outright when the
# command is generated inside the container. Format generated migrations with
# `make format` instead.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
